<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teaching Courses | PrefSchedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --warning: #ff9f1c;
            --danger: #f72585;
            --dark: #2b2d42;
            --gray: #8d99ae;
            --light: #f8f9fa;
        }

        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        header.page-header { margin-bottom: 40px; text-align: center; }
        .section-title {
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
            color: var(--dark);
            font-weight: 700;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .course-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .course-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin: 0 0 10px 0; }
        .course-meta { font-size: 0.9rem; color: var(--gray); margin-bottom: 20px; }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn-students { background-color: var(--primary); color: white; }
        .btn-students:hover { background-color: #3046bc; }

        .btn-pref { background-color: var(--warning); color: white; }
        .btn-pref:hover { background-color: #e68a00; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 5% auto; padding: 35px; border-radius: 20px; width: 50%; max-height: 80vh; overflow-y: auto; }

        .pref-form { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; background: var(--light); padding: 20px; border-radius: 15px; }
        .pref-row { display: flex; gap: 10px; align-items: center; }
        .pref-row select, .pref-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }

        .pref-list { list-style: none; padding: 0; }
        .pref-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .btn-del-pref { background: none; color: var(--danger); width: auto; padding: 5px; font-size: 1.2rem; }

        .progress-container { background: #eee; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--success); height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
    <header class="page-header">
        <h1>My Teaching Courses</h1>
        <p style="color: var(--gray)">Manage your course rosters and scoring preferences</p>
    </header>

    <h2 class="section-title">Compulsory Courses</h2>
    <div id="compulsoryGrid" class="course-grid"></div>

    <h2 class="section-title">Optional Courses</h2>
    <div id="optionalGrid" class="course-grid"></div>
</div>

<div id="mainModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Title</h2>
        <div id="modalBody"></div>
        <button onclick="closeModal()" style="margin-top:20px; background: var(--dark); color: white;">Close</button>
    </div>
</div>

<script>
    const BASE_URL = "http://localhost:8080/api";
    const username = localStorage.getItem('username');
    const token = localStorage.getItem('token');
    let currentInstructorId = null;

    document.addEventListener('DOMContentLoaded', loadTeachingData);

    async function loadTeachingData() {
        if (!username) { window.location.href = 'index.html'; return; }

        try {
            const userRes = await fetch(`${BASE_URL}/instructors/username/${username}`);
            if (!userRes.ok) throw new Error("Instructor profile not found.");

            const instructor = await userRes.json();
            currentInstructorId = instructor.id;

            const response = await fetch(`${BASE_URL}/instructors/${instructor.id}/courses`);
            const data = await response.json();

            renderGrid('compulsoryGrid', data.compulsory, false);
            renderGrid('optionalGrid', data.optional, true);

        } catch (err) {
            console.error("Error:", err);
            alert("Error loading data: " + err.message);
        }
    }

    function renderGrid(elementId, courses, isOptional) {
        const grid = document.getElementById(elementId);
        grid.innerHTML = '';
        if (courses && courses.length > 0) {
            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                const year = course.pack ? course.pack.year : 'N/A';

                card.innerHTML = `
                    <h3 class="course-title">${course.name}</h3>
                    <div class="course-meta">
                        Code: <strong>${course.code}</strong><br>
                        Year: ${year} | Type: ${course.type}
                    </div>
                    <div class="card-actions">
                        ${isOptional ? `
                            <button class="btn-students" onclick="viewAssignedStudents('${course.code}')">See Assigned Students</button>
                            <button class="btn-pref" onclick="openPreferenceModal('${course.code}', ${year})">Set Preferences</button>
                        ` : `
                            <p style="color: var(--gray); font-size: 0.8rem; font-style: italic; text-align: center;">Enrollment managed by year group</p>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        } else {
            grid.innerHTML = '<p>No courses assigned.</p>';
        }
    }

    async function viewAssignedStudents(courseCode) {
        const modal = document.getElementById('mainModal');
        const body = document.getElementById('modalBody');
        document.getElementById('modalTitle').innerText = `Assigned Students: ${courseCode}`;
        body.innerHTML = '<p>Loading...</p>';
        modal.style.display = 'block';

        try {
            const res = await fetch(`${BASE_URL}/assignments/course/${courseCode}`);
            const students = await res.json();
            if(students.length === 0) { body.innerHTML = '<p>No students assigned yet.</p>'; return; }

            let html = '<table style="width:100%; border-collapse: collapse;"><thead><tr><th style="text-align:left; padding:10px; border-bottom:1px solid #ddd;">Code</th><th style="text-align:left; padding:10px; border-bottom:1px solid #ddd;">Name</th></tr></thead><tbody>';
            students.forEach(s => { html += `<tr><td style="padding:10px; border-bottom:1px solid #eee;">${s.studentCode}</td><td style="padding:10px; border-bottom:1px solid #eee;">${s.studentName || 'N/A'}</td></tr>`; });
            html += '</tbody></table>';
            body.innerHTML = html;
        } catch (err) { body.innerHTML = '<p style="color:red;">Error loading students.</p>'; }
    }

    async function openPreferenceModal(courseCode, optionalYear) {
        const modal = document.getElementById('mainModal');
        const body = document.getElementById('modalBody');
        document.getElementById('modalTitle').innerText = `Scoring Preferences: ${courseCode}`;
        modal.style.display = 'block';

        body.innerHTML = `
            <div class="pref-form">
                <p style="font-size: 0.85rem; color: var(--gray);">Choose a prior course to base scoring on:</p>
                <div class="pref-row">
                    <select id="newAbbr">
                        <option value="">Loading eligible courses...</option>
                    </select>
                    <input type="number" id="newWeight" placeholder="Weight %" min="1" max="100">
                    <button class="btn-pref" style="width:auto;" onclick="savePreference('${courseCode}')">Save</button>
                </div>
            </div>
            <div id="prefListContainer">Loading preferences...</div>
        `;

        await populatePriorCourses(optionalYear);
        loadPreferences(courseCode);
    }

    async function populatePriorCourses(currentYear) {
        const select = document.getElementById('newAbbr');
        try {
            const res = await fetch(`${BASE_URL}/courses`); // Apelează getAll() din CourseController
            const courses = await res.json();

            // Filtrare: doar cursuri din ani strict mai mici
            const eligible = courses.filter(c => c.pack && c.pack.year < currentYear);

            if (eligible.length === 0) {
                select.innerHTML = '<option value="">No prior courses available</option>';
            } else {
                select.innerHTML = '<option value="">-- Select Course --</option>' +
                    eligible.map(c => `<option value="${c.abbreviation}">${c.abbreviation} (${c.name} - Yr ${c.pack.year})</option>`).join('');
            }
        } catch (err) { select.innerHTML = '<option value="">Error loading list</option>'; }
    }

    async function loadPreferences(courseCode) {
        const container = document.getElementById('prefListContainer');
        try {
            const res = await fetch(`${BASE_URL}/instructor-preferences/weights/${courseCode}`);
            const data = await res.json();

            let html = `
                <div style="margin-bottom:15px;">
                    <strong>Total Weight: ${data.totalWeight}%</strong>
                    <div class="progress-container"><div class="progress-bar" style="width: ${data.totalWeight}%"></div></div>
                </div>
                <ul class="pref-list">
            `;
            data.weights.forEach(p => {
                html += `<li class="pref-item"><span><strong>${p.compulsoryCourseAbbr}</strong>: ${p.weightPercentage}%</span>
                        <button class="btn-del-pref" onclick="deletePreference(${p.id}, '${courseCode}')">&times;</button></li>`;
            });
            container.innerHTML = data.weights.length > 0 ? html + '</ul>' : '<p>No preferences set.</p>';
        } catch (err) { container.innerHTML = '<p>Error loading weights.</p>'; }
    }

    async function savePreference(courseCode) {
        const abbr = document.getElementById('newAbbr').value;
        const weight = document.getElementById('newWeight').value;
        if(!abbr || !weight) { alert("Select a course and enter weight."); return; }

        try {
            const res = await fetch(`${BASE_URL}/instructor-preferences`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    instructorId: currentInstructorId,
                    courseCode: courseCode,
                    compulsoryCourseAbbr: abbr,
                    weightPercentage: parseFloat(weight)
                })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.error || data.message);
            loadPreferences(courseCode);
        } catch (err) { alert(err.message); }
    }

    async function deletePreference(id, courseCode) {
        if(confirm("Delete rule?")) {
            await fetch(`${BASE_URL}/instructor-preferences/${id}`, { method: 'DELETE' });
            loadPreferences(courseCode);
        }
    }

    function closeModal() { document.getElementById('mainModal').style.display = 'none'; }
    fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
</script>
</body>
</html>
