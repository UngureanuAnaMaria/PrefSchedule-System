<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Import Users | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4361ee; --success: #2ec4b6; --danger: #f72585; --dark: #2b2d42; --gray: #8d99ae; }
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--dark); }
        .upload-box { border: 2px dashed #ddd; padding: 30px; text-align: center; border-radius: 10px; margin-top: 20px; transition: 0.3s; }
        .upload-box:hover { border-color: var(--primary); background: #f1f4ff; }
        .btn-upload { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .status { margin-top: 15px; font-weight: 500; display: none; }
    </style>
</head>
<body>
<div id="header-placeholder"></div>
<div class="container">
    <h1>User Management (CSV Import)</h1>

    <div class="card">
        <h3>Import Students</h3>
        <p style="color: var(--gray); font-size: 0.9em;">CSV Columns: <b>username, name, email, password, code, year</b></p>
        <div class="upload-box">
            <input type="file" id="studentFile" accept=".csv">
            <br>
            <button class="btn-upload" onclick="handleImport('students')">Process Students</button>
            <div id="status-students" class="status"></div>
        </div>
    </div>

    <div class="card">
        <h3>Import Instructors</h3>
        <p style="color: var(--gray); font-size: 0.9em;">CSV Columns: <b>username, name, email, password</b></p>
        <div class="upload-box">
            <input type="file" id="instructorFile" accept=".csv">
            <br>
            <button class="btn-upload" onclick="handleImport('instructors')">Process Instructors</button>
            <div id="status-instructors" class="status"></div>
        </div>
    </div>
</div>

<script>
    // Incarca Header-ul
    fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);

    async function handleImport(type) {
        const fileInput = document.getElementById(type === 'students' ? 'studentFile' : 'instructorFile');
        const statusDiv = document.getElementById(`status-${type}`);

        if (!fileInput.files[0]) { alert("Please select a file!"); return; }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        statusDiv.style.display = 'block';
        statusDiv.style.color = 'var(--dark)';
        statusDiv.innerText = "Processing file...";

        try {
            const response = await fetch(`http://localhost:8080/api/auth/import/${type}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                body: formData
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.style.color = 'var(--success)';
                statusDiv.innerText = "✓ " + data.message;
                fileInput.value = "";
            } else {
                throw new Error(data.error || "Import failed");
            }
        } catch (err) {
            statusDiv.style.color = 'var(--danger)';
            statusDiv.innerText = "Error: " + err.message;
        }
    }
</script>
</body>
</html>
