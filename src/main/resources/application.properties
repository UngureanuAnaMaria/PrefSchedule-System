spring.application.name=prefSchedule
spring.datasource.url=jdbc:postgresql://localhost:5432/prefschedule
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT Configuration - FARA COMENTARII PE ACEEASI LINIE!
jwt.secret=mySuperSecretKeyThatIsAtLeast32CharactersLong123!ForPrefScheduleApp
jwt.expiration=86400000

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

#spring.main.allow-circular-references=true


#lab7
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=manual
spring.kafka.listener.missing-topics-fatal=false
# offset ul porneste de la latest
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false

# nu mai apare ConsumerConfig values
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=INFO

#lab 8 - Resilience4j Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stableMatchService.base-config=default

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.instances.stableMatchService.base-config=default

resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.configs.default.cancel-running-future=true
resilience4j.timelimiter.instances.stableMatchService.base-config=default

# RestTemplate timeout configuration
spring.mvc.async.request-timeout=10000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# StableMatch service configuration
stable-match.service.url=http://localhost:8082
stable-match.service.timeout=5000
stable-match.service.retry-max-attempts=3


#lab9
# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=prefSchedule
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Load Balancer Configuration
spring.cloud.loadbalancer.health-check.interval=10s
spring.cloud.loadbalancer.cache.enabled=true